name: Charity request
description: Request help from a volunteer engineer for your charity or nonprofit.
title: "[Request] <your organization>"
labels: ["charity-request", "needs-scoping"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out! You don't need to know the technical solution — just tell us what's painful today. A volunteer will follow up to scope it with you.
  - type: input
    id: org
    attributes:
      label: Organization
      description: Your charity / nonprofit name.
    validations:
      required: true
  - type: textarea
    id: mission
    attributes:
      label: Mission
      description: What does your organization do, and who does it serve?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's slow, manual, painful, or impossible today? In your own words.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Point of contact
      description: Who would we work with? (name + how to reach you — an email is fine)
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Timeline
      options:
        - No rush
        - Would help within a few months
        - Fairly urgent
    validations:
      required: false
