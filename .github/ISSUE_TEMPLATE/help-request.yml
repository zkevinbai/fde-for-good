name: Request help
description: Ask a volunteer engineer to help your mission-driven organization or small business.
title: "[Request] <your organization>"
labels: ["help-request", "needs-scoping"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out! You don't need to know the technical solution — just tell us what's painful today. A volunteer will follow up to scope it with you. (Not sure if you're a fit? See [who we help](https://github.com/zkevinbai/fde-for-good/blob/main/docs/who-we-help.md).)
  - type: input
    id: name
    attributes:
      label: Your name
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Your role
      description: e.g. Owner, Director, Volunteer
    validations:
      required: false
  - type: input
    id: email
    attributes:
      label: Email
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone (optional)
    validations:
      required: false
  - type: input
    id: org
    attributes:
      label: Organization name
      description: Your charity, group, or business name.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: What kind of organization are you?
      options:
        - Charity / nonprofit
        - Community group / mutual aid
        - Small local business
        - Social enterprise
        - Other
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: City / region.
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Website or social
      description: A link or @handle.
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: What do you do?
      description: What's your mission or your business, and who do you serve?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's slow, manual, painful, or impossible today? In your own words.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What would success look like?
      description: How would you know this worked?
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Timeline
      options:
        - No rush
        - Within a few months
        - Fairly urgent
    validations:
      required: false
  - type: dropdown
    id: affordability
    attributes:
      label: Could you pay someone to do this?
      description: Honest answers help us prioritize fairly — we focus where our help goes furthest.
      options:
        - "No — it's out of reach"
        - "Maybe a little, but not market rate"
        - "Yes — we could pay for this"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: Constraints, tools you already use, how you heard about us…
    validations:
      required: false
